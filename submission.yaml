# Local development only. kit check will never call this submittable, by design:
# the competition accepts only google-cloud/<id> models.
#
# Google AI Studio via its OpenAI-compatible layer. Set MODEL_API_KEY to an AI
# Studio key (aistudio.google.com/apikey).
#
# Why this model: Gemini models support function calling, which this harness
# depends on. Gemma's free limits are far more generous on requests per day
# (14,400 vs 500) but only 16K tokens/min, and its tool-calling support through
# the OpenAI layer is unconfirmed - test it before switching.
#
#   gemini-3.5-flash-lite   15 RPM   250K TPM   500 RPD   tools: yes
#   gemma-4-26b-a4b-it      30 RPM    16K TPM  14.4K RPD  tools: UNCONFIRMED
#
# Google does not publish these; they are per Google Cloud project and visible
# at aistudio.google.com/rate-limit. Read your own numbers there.
name: contract-first-dev
model_api: openai-compatible/gemini-3.5-flash-lite
model_base_url: https://generativelanguage.googleapis.com/v1beta/openai
install: >-
  uv venv --python 3.12 /opt/harness/venv
  && uv pip install --python /opt/harness/venv/bin/python -r {src}/requirements.txt
serve: /opt/harness/venv/bin/python {src}/serve.py
