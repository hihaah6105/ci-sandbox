# PLE dev-set runner on GitHub Actions.
#
# Why this exists: every task gets its own fresh runner, so tasks run in
# parallel instead of one at a time, and nothing depends on the laptop.
#
# Runner size depends on repository visibility:
#   private -> 2 vCPU,  8 GB RAM, 14 GB disk, 2,000 free minutes a month
#   public  -> 4 vCPU, 16 GB RAM, 14 GB disk, unlimited free minutes
# This repo is private, so minutes are metered: keep agent_minutes small for
# plumbing tests and raise it only for real runs.
#
# Run it from the Actions tab -> "PLE dev run" -> "Run workflow".
#
# Secrets this needs (Settings -> Secrets and variables -> Actions -> New
# repository secret). Add them yourself in the browser; never paste a key into
# a file, a chat, or a commit:
#   HF_TOKEN        - Hugging Face read token (the PLE dataset is gated)
#   MODEL_API_KEY   - key for whichever dev model you are using
#
name: PLE dev run

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Comma-separated task ids, or "all" for the full dev set'
        required: true
        default: 'landscape-sheet-revision'
      kit_ref:
        description: 'Branch or tag of google-research/ple to use'
        required: true
        default: 'main'
      max_steps:
        description: 'Hard cap on agent steps = model requests. OpenRouter free allows 20/min and 50/day (1,000 after a one-off $10). Use 12 for a plumbing test; 160 for a real run.'
        required: true
        default: '12'
      agent_minutes:
        description: 'Agent time cap per task, minutes. Keep below 300 - the job itself dies at 360. 60 is plenty for a plumbing test; raise it for real runs.'
        required: true
        default: '60'

permissions:
  contents: read

jobs:
  # Turn the comma-separated input into a matrix, one job per task.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        run: |
          IN='${{ inputs.tasks }}'
          if [ "$IN" = "all" ]; then
            IN='backfeed-energization-reply,cooling-water-flush-plan,data-center-site-model,data-hall-device-takeoff,data-hall-mep-routing,data-hall-mep-routing-offset,division-26-specifications,emergency-spillway-check,engineers-estimate-check,eor-review-corrections,fill-compaction-acceptance,fire-solve-convergence,fire-test-validation-memo,footing-settlement-verification,foundation-strategy,frame-extension-method,heat-rejection-life-cycle-cost,landscape-sheet-revision,les-mesh-resolution,lv-cable-sizing,mv-conveyance-study,permission-to-operate-memo,pre-application-capacity-response,roof-deck-design,seismic-diaphragm-shear,shoring-design-verification,solar-supplemental-review,solar-witness-test-package,wind-diaphragm-shear'
          fi
          JSON=$(printf '%s' "$IN" | tr -d ' ' | python3 -c 'import sys,json; print(json.dumps([t for t in sys.stdin.read().split(",") if t]))')
          echo "matrix={\"task\":$JSON}" >> "$GITHUB_OUTPUT"
          echo "Will run: $JSON"

  run-task:
    needs: plan
    runs-on: ubuntu-latest
    # The hard platform ceiling is 360 minutes. Stay under it so the job can
    # still upload its artifacts instead of being killed mid-write.
    timeout-minutes: 330
    strategy:
      fail-fast: false          # one bad task must not cancel the others
      # One at a time. Google AI Studio's 250K tokens-per-minute cap is per
      # Cloud *project*, not per key or per job, and a single task measured
      # 178K input tokens in 77 s (~139K TPM). Two jobs would sit over the cap
      # and spend the run retrying 429s.
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false   # we need Docker working
          swap-storage: false

      - name: Show available resources
        run: |
          echo "--- cpu/mem ---"; nproc; free -g
          echo "--- disk ---";    df -h /

      - name: Check out this entry
        uses: actions/checkout@v4
        with:
          path: entry

      - name: Check out the PLE competition kit
        uses: actions/checkout@v4
        with:
          repository: google-research/ple
          ref: ${{ inputs.kit_ref }}
          path: kit

      - name: Bring in the evaluator's taskbridge
        run: |
          set -e
          SRC=$(find kit -name taskbridge.py -print -quit)
          if [ -z "$SRC" ]; then
            echo "::error::taskbridge.py not found in the kit checkout"; exit 1
          fi
          cp "$SRC" entry/taskbridge.py
          echo "copied $SRC -> entry/taskbridge.py"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the kit's harbor tool
        # The kit refuses to run without this and prints the exact command:
        #   "Harbor is not installed: uv tool install harbor==0.20.0 --with websockets"
        run: |
          uv tool install harbor==0.20.0 --with websockets
          uv tool list

      - name: Cache the Hugging Face dataset
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ple-${{ matrix.task }}
          restore-keys: |
            hf-ple-

      - name: Run the task
        working-directory: kit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Rename this to whatever your submission.yaml expects, e.g.
          # OPENROUTER_API_KEY / GEMINI_API_KEY / OPENAI_API_KEY.
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          PLE_AGENT_TIMEOUT_MINUTES: ${{ inputs.agent_minutes }}
          PLE_MAX_STEPS: ${{ inputs.max_steps }}
        run: |
          set -o pipefail
          rc=0
          uv run python eval/run.py "$GITHUB_WORKSPACE/entry" \
            --tasks "${{ matrix.task }}" \
            2>&1 | tee "$RUNNER_TEMP/run.log" || rc=$?
          echo "eval/run.py exit code: $rc"
          # The kit ends with a commit-readiness check that fails here because
          # this dev repo gitignores artifacts/ and we only ran one task. That
          # is a packaging complaint, not a task failure, so judge the job on
          # whether a results.json was actually produced.
          if ! ls runs/*/results.json >/dev/null 2>&1; then
            echo "::error::no results.json - the task did not run"
            exit 1
          fi

      # Everything needed to debug a zero without downloading the artifact zip.
      - name: What the agent did
        if: always()
        working-directory: kit
        run: |
          echo "===== results.json ====="
          cat runs/*/results.json 2>/dev/null || echo "(none)"
          echo
          # When a task's own image fails to build, the kit prints only a one
          # line note ("its image did not build: Dockerfile:306") and the real
          # docker error is in harbor.log. Run 7 lost 46 minutes to that.
          echo "===== harbor / build log, last 200 lines ====="
          tail -n 200 runs/*/attempt*/harbor.log 2>/dev/null || echo "(none)"
          echo
          echo "===== any other build log ====="
          find runs -maxdepth 6 -type f \( -name '*.log' -o -name 'result.json' \) \
            -newermt '-120 minutes' 2>/dev/null | head -10 \
            | while read -r f; do echo "----- $f -----"; tail -c 4000 "$f"; echo; done
          echo
          echo "===== disk ====="
          df -h / | tail -1
          echo
          echo "===== what the agent left in the graded answer ====="
          find "$GITHUB_WORKSPACE/entry/artifacts" -maxdepth 6 -type f \
            -printf '%10s  %p\n' 2>/dev/null | head -60 || echo "(none)"
          echo
          echo "===== final message ====="
          cat "$GITHUB_WORKSPACE"/entry/artifacts/*/final_message.md 2>/dev/null || echo "(none)"
          echo
          # The evaluator already records every tool call in trajectory.json.
          # Summarise it rather than dumping 220 KB of JSON into the log.
          echo "===== step-by-step trace ====="
          python3 - <<'TRACE'
          import glob, json
          for path in sorted(glob.glob('runs/*/artifacts/*/trajectory.json')):
              print(f"--- {path}")
              try:
                  steps = json.load(open(path)).get('steps') or []
              except Exception as exc:
                  print(f"    unreadable: {exc}"); continue
              for st in steps:
                  who = st.get('source')
                  calls = st.get('tool_calls') or []
                  msg = (st.get('message') or '').replace('\n', ' ')[:160]
                  if calls:
                      for c in calls:
                          arg = json.dumps(c.get('arguments') or {})[:160]
                          print(f"  {str(st.get('step_id', '?')):>3} {str(who):<5} {c.get('function_name')} {arg}")
                  else:
                      print(f"  {str(st.get('step_id', '?')):>3} {str(who):<5} (no tool call) {msg}")
              print(f"    {len(steps)} steps")
          TRACE

      - name: Disk after run
        if: always()
        run: df -h /

      - name: Upload artifacts and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ple-${{ matrix.task }}
          path: |
            entry/artifacts/**
            kit/runs/**
            ${{ runner.temp }}/run.log
          if-no-files-found: warn
          retention-days: 14

  # Collect every task's reward into one summary you can read at a glance.
  summarise:
    needs: run-task
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
      - name: Build summary
        run: |
          echo "## PLE dev run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| task | reward |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, glob, os
          rows = []
          for m in glob.glob('all/**/manifest.json', recursive=True):
              try:
                  for tid, rec in json.load(open(m))['tasks'].items():
                      rows.append((tid, rec.get('reward')))
              except Exception:
                  pass
          for tid, r in sorted(set(rows)):
              print(f"| {tid} | {r} |")
          if rows:
              vals = [r for _, r in rows if isinstance(r, (int, float))]
              if vals:
                  print(f"| **mean of {len(vals)}** | **{sum(vals)/len(vals):.4f}** |")
          else:
              print("| no manifest found | check the run log |")
          PY
